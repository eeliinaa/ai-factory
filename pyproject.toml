[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-product-factory"
version = "0.1.0"
description = "Lean AI-assisted Etsy product generation pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.51.0",
  "openpyxl>=3.1.5",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.1",
  "reportlab>=4.2.2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.9"
]

[project.scripts]
ai-product-factory = "ai_product_factory.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]